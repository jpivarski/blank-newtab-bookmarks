<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blank New Tab + Bookmarks — Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>Blank New Tab + Bookmarks</h1>

  <div class="row">
    <label for="rootFolder">Bookmarks folder to show</label>
    <select id="rootFolder"></select>
  </div>

  <div class="row">
    <label for="position">Layout</label>
    <select id="position">
      <option value="top">Toolbar strip at the top</option>
      <option value="center">Centered on the page</option>
    </select>
  </div>

  <div class="row">
    <label for="theme">Theme</label>
    <select id="theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="row checkbox-row">
    <input type="checkbox" id="showFavicons">
    <label for="showFavicons">Show site icons</label>
  </div>

  <div class="row checkbox-row">
    <input type="checkbox" id="openInNewTab">
    <label for="openInNewTab">Always open bookmarks in a new tab</label>
  </div>

  <button id="save">Save</button>
  <span id="status"></span>

  <p class="hint">
    Tip: after installing, hide Chrome's real Bookmarks Bar with <kbd>Ctrl+Shift+B</kbd>
    (<kbd>⌘+Shift+B</kbd> on Mac). It will then only appear here, on new tabs.
  </p>

  <script src="options.js"></script>
</body>
</html>
